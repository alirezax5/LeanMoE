name: phase-3c3a-chat-template-v5
on:
  workflow_dispatch:
  push:
    branches: [phase-3c3a-chat-template]
jobs:
  windows-cuda:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - name: Checkout pinned llama.cpp
        shell: pwsh
        run: |
          if (-not (Test-Path external/llama.cpp/.git)) { git clone https://github.com/ggml-org/llama.cpp.git external/llama.cpp }
          git -C external/llama.cpp fetch origin cea74625f
          git -C external/llama.cpp checkout --detach cea74625f
      - name: Setup CUDA 13.4
        uses: ./external/llama.cpp/.github/actions/windows-setup-cuda
        with:
          cuda_version: "13.4"
          cuda_arch: "x64"
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSROOT=%%i
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S native/bridge -B build/bridge -G "Ninja Multi-Config" -DLLAMA_CPP_DIR="%GITHUB_WORKSPACE%\external\llama.cpp" -DGGML_CUDA=ON -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=89
          cmake --build build/bridge --config Release
      - name: Stage and validate runtime
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $stage="$env:GITHUB_WORKSPACE\artifact-runtime"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach($n in @("leanmoe_bridge.dll","llama-common.dll","llama.dll","ggml.dll","ggml-base.dll","ggml-cpu.dll","ggml-cuda.dll")){
            $f=Get-ChildItem build/bridge -Recurse -File -Filter $n | Select-Object -First 1
            if(!$f){throw "Missing build DLL: $n"}; Copy-Item $f.FullName "$stage\$n" -Force
          }
          function FindDll($n){
            foreach($d in ($env:PATH -split ';')){if($d -and (Test-Path $d)){ $x=Join-Path $d $n; if(Test-Path $x){return Get-Item $x}}}
            foreach($r in @($env:CUDA_PATH,$env:CUDA_PATH_V13_4,$env:RUNNER_TOOL_CACHE,"C:\Program Files\NVIDIA GPU Computing Toolkit")){
              if($r -and (Test-Path $r)){ $x=Get-ChildItem $r -Recurse -File -Filter $n -ErrorAction SilentlyContinue | Select-Object -First 1; if($x){return $x}}
            }
            throw "Required runner DLL not found: $n"
          }
          foreach($n in @("cublas64_13.dll","cublasLt64_13.dll")){$f=FindDll $n; Copy-Item $f.FullName "$stage\$n" -Force; Write-Host "[STAGE] $n <- $($f.FullName)"}
          $v=Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -File -Filter vcomp140.dll -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\x64\\'} | Select-Object -First 1
          if($v){Copy-Item $v.FullName "$stage\vcomp140.dll" -Force}
          $env:PATH="$stage;$env:PATH"; Set-Location $stage
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class B { [DllImport("leanmoe_bridge.dll",CallingConvention=CallingConvention.Cdecl)] public static extern UInt32 lm_api_version(); }'
          $api=[B]::lm_api_version(); if($api -ne 5){throw "Expected API 5, got $api"}; Write-Host "[PASS] staged runtime API v5"
      - uses: actions/upload-artifact@v4
        with:
          name: leanmoe-phase3c3a-runtime-v5
          path: artifact-runtime/*
          if-no-files-found: error
